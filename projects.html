<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.3/dist/tailwind.min.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" crossorigin="anonymous">
  <link rel="icon" type="image/png" href="https://avatars.githubusercontent.com/u/74209018?v=4">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tailwindcss/typography@0.2.x/dist/typography.min.css"/>
  <link rel="stylesheet" href="style.css">
  <title>Shahe Bannis - Projects</title>
  <style>
    /* Add your existing dark mode styles here */

    /* Transition styles for swiping from right to left */
    .projects-container {
      opacity: 0;
      transform: translateX(100%);
      animation: slide-in 1s forwards;
    }

    @keyframes slide-in {
      to {
        opacity: 1;
        transform: translateX(0);
      }
    }

    .project-card {
      background: white;
      border-radius: 0.5rem;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
      transition: transform 0.3s, box-shadow 0.3s;
      padding: 1rem;
      cursor: pointer;
      margin-bottom: 1rem;
      min-height: 10rem; /* Adjust as needed for your content */
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .dark-mode .project-card {
      background-color: #1a1a1a;
      color: #f8f8f8;
      padding: 1rem;
      border-radius: 0.5rem;
      box-shadow: 0 4px 6px rgba(151, 151, 151, 0.1), 0 1px 3px rgba(150, 150, 150, 0.06);
      transition: transform 0.3s;
      min-height: 10rem; /* Adjust as needed for your content */
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .project-card:hover {
      transform: translateY(-5px);
    }

    .project-link {
      color: #f39c12;
      text-decoration: none;
      transition: color 0.3s;
    }

    .project-link:hover {
      color: #e67e22;
    }

    .prose {
      padding-right: 0 !important;
      padding-left: 0 !important;
      max-width: 100% !important;
    }
    .prose strong, .prose b {
      color: #f39c12; /* Orange for strong text */
    }
    .prose ul > li::marker,
    .prose ol > li::marker {
      color: #f39c12; /* Orange for list markers */
    } 
    .prose a {
      color: #f39c12 !important; /* Orange for links */
      text-decoration: underline;
    }

    .prose a:hover {
      color: #e67e22; /* Slightly darker orange on hover */
    }
  </style>
</head>
<body class="bg-white dark-mode relative">
  <div id="particles-js"></div>
  
  <!-- Taskbar -->
  <nav id="taskbar" class="taskbar text-white">
    <a href="index.html" class="home-link">Home</a>
    <div class="nav-items">
      <div class="center-with-button">
        <a href="about.html" class="hover:text-gray-300 transition-colors duration-200">About</a>
        <a href="projects.html" class="hover:text-gray-300 transition-colors duration-200">Projects</a>
        <a href="blog.html" class="hover:text-gray-300 transition-colors duration-200">Blogs</a>
        <a href="index.html" class="hover:text-gray-300 transition-colors duration-200">Contact</a>
      </div>
      <button id="dark-mode-toggle" class="ml-4 p-2 text-white rounded shadow-md">☀️</button>
    </div>
  </nav>

  <div class="flex flex-col items-center justify-center min-h-screen">
    <div id="projects-container" class="projects-container px-4 py-5 mt-8 space-y-4 w-full max-w-4xl mx-auto">
      <h1 class="text-4xl font-bold mb-10">Projects</h1>
      <div id="projects-list" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-6"></div>
      <!-- <div id="projects-list" class="grid grid-cols-1 md:grid-cols-2 gap-4 flex-wrap">
        Fetched Projects Markdown files will be displayed here
      </div> -->
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>
  <script type="text/javascript" src="JavaScript/particles.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>


  <script>
    document.addEventListener("DOMContentLoaded", () => {
      document.body.classList.add("dark-mode");
      document.getElementById("dark-mode-toggle").innerText = "☀️";

      fetch('projects/projects.json')
      .then(res => res.json())
      .then(projects => {
        const projectsList = document.getElementById('projects-list');
        projects.forEach(project => {
          const card = document.createElement('div');
          card.className = 'project-card relative';

          // Badge for private projects
          const privateBadge = project.private
            ? `<span class="absolute top-2 right-2 bg-red-500 text-white text-xs px-2 py-1 rounded">Private</span>`
            : '';

            // GitHub link or private note
            const githubSection = project.github
              ? `<a href="${project.github}" target="_blank" class="project-link">GitHub</a>`
              : `<span class="text-gray-500 text-sm">Source available on request</span>`;

          card.innerHTML = `
            ${privateBadge}
            <h2 class="text-2xl font-bold mb-2">${project.title}</h2>
            <p class="mb-2">${project.description}</p>
            ${githubSection}
            <div class="flex justify-end mt-6">
              <button class="expand-btn bg-yellow-500 hover:bg-yellow-600 text-white px-4 py-2 rounded shadow">Learn More</button>
            </div>
          `;
          card.querySelector('.expand-btn').onclick = () => {
            const modal = document.getElementById('project-modal');
            const modalContent = document.getElementById('modal-content');
            modal.classList.remove('hidden');
            modalContent.innerHTML = '<p class="text-gray-500">Loading...</p>';
            fetch(project.md)
              .then(res => {
                if (!res.ok) throw new Error('Markdown file not found');
                return res.text();
              })
              .then(md => {
                modalContent.innerHTML = marked.parse(md);
              })
              .catch(err => {
                modalContent.innerHTML = '<p class="text-red-500">Could not load details.</p>';
              });
          };

          // Close modal logic
          document.getElementById('close-modal').onclick = () => {
            document.getElementById('project-modal').classList.add('hidden');
          };
          document.getElementById('project-modal').onclick = (e) => {
            if (e.target === e.currentTarget) {
              e.currentTarget.classList.add('hidden');
            }
          };
          projectsList.appendChild(card);
        });
      });
    });

    document.getElementById("dark-mode-toggle").addEventListener("click", () => {
      document.body.classList.toggle("dark-mode");

      const toggleBtn = document.getElementById("dark-mode-toggle");
      const taskbar = document.getElementById("taskbar");
      const isDarkModeOn = document.body.classList.contains("dark-mode");

      toggleBtn.innerText = isDarkModeOn ? "☀️" : "🌓";
      
      if (isDarkModeOn) {
        taskbar.classList.remove("light-mode");
      } else {
        taskbar.classList.add("light-mode");
      }

      document.querySelectorAll('.project-box').forEach(box => {
        box.classList.toggle('dark');
      });
    });

    
  </script>
  <div id="project-modal" class="fixed inset-0 bg-black bg-opacity-70 flex items-center justify-center z-50 hidden">
  <div class="bg-white dark:bg-gray-900 rounded-lg shadow-lg max-w-3xl w-full p-8 relative">
    <button id="close-modal" class="absolute top-4 right-4 text-2xl text-gray-700 dark:text-gray-200 hover:text-red-500">&times;</button>
    <div id="modal-content" class="prose dark:prose-invert overflow-y-auto" style="max-height:70vh;"></div>
  </div>
</div>
</body>
</html>
